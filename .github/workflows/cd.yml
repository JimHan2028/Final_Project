name: CD Build Pipeline
on:
  push:
    branches: [ staging, main ]

jobs:
  build_target_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create staging .env from staging GitHub secret
        if: github.ref == 'refs/heads/staging'
        env:
          ENV_CONTENT: ${{ secrets.STAGING_ENV_CONTENT }}
        run: printf '%s\n' "$ENV_CONTENT" > .env

      - name: Create production .env from production GitHub secret
        if: github.ref == 'refs/heads/main'
        env:
          ENV_CONTENT: ${{ secrets.PROD_ENV_CONTENT }}
        run: printf '%s\n' "$ENV_CONTENT" > .env

      - name: Build staging Docker image
        if: github.ref == 'refs/heads/staging'
        run: docker build -t mlops-app:staging .

      - name: Build production Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t mlops-app:prod .
