name: CI Pipeline
on:
  pull_request:
    branches: [ dev, staging, main ]

jobs:
  ci_checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black pytest

      - name: Linting and static analysis with ruff
        run: ruff check .

      - name: Format check with black
        run: black --check .

      - name: Run the full application test suite
        run: pytest -v

      - name: Build Docker image and verify no build‑time errors
        run: docker build -t mlops-assignment-ci:validate .
